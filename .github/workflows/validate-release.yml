name: Validate userscript and updater
on:
  push:
    paths-ignore:
      - data/killstreak-prices.json
      - data/update-prices-state.json
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run benchmark
