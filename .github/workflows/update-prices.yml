name: Refresh Killstreak Prices

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Start this scan size, or resume the active saved cycle"
        required: true
        type: choice
        default: incremental
        options:
          - test
          - incremental
          - full
  schedule:
    # Cheap due-time checks. Steam is contacted only when the saved state is due.
    # New cycles: 5 hours after completion. Interrupted cycles: >=30 minute cooldown.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

concurrency:
  group: tf2-price-database-refresh
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate database and existing checkpoint
        run: >-
          python updater/update_prices.py
          --state-file data/update-prices-state.json
          --validate

      - name: Refresh or resume due prices
        env:
          SCAN_MODE: ${{ inputs.scan_mode || 'incremental' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          case "$SCAN_MODE" in
            test) limit=6; leading=2 ;;
            incremental) limit=60; leading=8 ;;
            full) limit=550; leading=8 ;;
            *) echo "Unknown scan mode: $SCAN_MODE" >&2; exit 1 ;;
          esac

          args=(
            --database data/killstreak-prices.json
            --state-file data/update-prices-state.json
            --limit "$limit"
            --leading "$leading"
            --delay 10
            --interval-hours 5
            --retry-minutes 30
            --max-requests 60
            --max-runtime-seconds 1200
          )
          if [[ "$SCHEDULED" == "true" ]]; then
            args+=(--scheduled)
          fi
          python updater/update_prices.py "${args[@]}"

      - name: Validate resulting database and checkpoint
        run: >-
          python updater/update_prices.py
          --state-file data/update-prices-state.json
          --validate

      - name: Save prices and retry checkpoint
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/killstreak-prices.json data/update-prices-state.json
          if git diff --cached --quiet; then
            echo "Not due; no price or checkpoint changes to publish."
            exit 0
          fi
          git commit -m "Save TF2 price updates and retry progress"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
