name: Refresh Killstreak Prices

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Choose how many weapon prices to refresh"
        required: true
        type: choice
        default: test
        options:
          - test
          - incremental
          - full

  schedule:
    # Every six hours.
    # Perth: approximately 2:17am, 8:17am, 2:17pm, 8:17pm.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tf2-price-database-refresh
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate existing database
        run: python updater/update_prices.py --validate

      - name: Refresh Steam prices
        env:
          # Scheduled runs use incremental mode.
          SCAN_MODE: ${{ inputs.scan_mode || 'incremental' }}
        run: |
          set -euo pipefail

          case "$SCAN_MODE" in
            test)
              # Six items, including two leading candidates per tier.
              python updater/update_prices.py \
                --limit 6 \
                --leading 2 \
                --delay 4
              ;;

            incremental)
              # Sixty items, including eight leading candidates per tier.
              python updater/update_prices.py \
                --limit 60 \
                --leading 8 \
                --delay 4
              ;;

            full)
              # All 550 names. Use occasionally or when seeding data.
              python updater/update_prices.py \
                --limit 550 \
                --leading 8 \
                --delay 4
              ;;

            *)
              echo "Unknown scan mode: $SCAN_MODE" >&2
              exit 1
              ;;
          esac

      - name: Validate refreshed database
        run: python updater/update_prices.py --validate

      - name: Commit updated prices
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/killstreak-prices.json

          if git diff --cached --quiet; then
            echo "No verified price changes to publish."
            exit 0
          fi

          git commit -m "Update TF2 Killstreak price database"
          git push
